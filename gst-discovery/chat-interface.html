<title>DARP GST Discovery</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script>(function(){try{document.documentElement.setAttribute('data-theme', localStorage.getItem('darp-theme') === 'dark' ? 'dark' : 'light');}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,600&display=swap" rel="stylesheet">

<style>
  /* ============ TOKENS (shared with the DARP landing page) ============ */
  :root{
    --bg: #0B0B0F;
    --bg-1: #111116;
    --bg-2: #15151B;
    --bg-3: #19191F;
    --line: #26212F;
    --line-soft: #1C1922;
    --text: #F3F3F6;
    --text-muted: #A3A3B0;
    --text-faint: #6F6F7C;
    --brass: #2F8CFF;
    --brass-strong: #00D9FF;
    --verified: #34D399;
    --flag: #F0A857;
    --danger: #F2555B;
    --glow: rgba(0,217,255,0.22);
    --radius: 18px;
    --serif: 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
    --sans: 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
    --mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
  }
  :root[data-theme="light"]{
    --bg: #F6F6F7;
    --bg-1: #FAFAFB;
    --bg-2: #FDFDFD;
    --bg-3: #FFFFFF;
    --line: #DEDCE6;
    --line-soft: #E7E5EF;
    --text: #18171F;
    --text-muted: #57555F;
    --text-faint: #8B8993;
    --brass: #0047AD;
    --brass-strong: #0098C8;
    --verified: #0E9D63;
    --flag: #C97816;
    --danger: #C8283A;
    --glow: rgba(0,120,180,0.15);
  }

  *,*::before,*::after{ box-sizing: border-box; transition: background-color .25s ease, border-color .25s ease, color .25s ease; }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; } }
  html,body{ height: 100%; }
  body{
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  img,svg{ max-width: 100%; display: block; }
  a{ color: inherit; }
  button{ font-family: inherit; }
  ::selection{ background: var(--brass); color: #fff; }
  :focus-visible{ outline: 2px solid var(--brass); outline-offset: 2px; border-radius: 4px; }

  .app{ height: 100vh; height: 100dvh; display: flex; flex-direction: column; }

  /* ============ HEADER ============ */
  .chat-header{
    position: sticky; top: 0; z-index: 20;
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px clamp(16px,4vw,32px);
    border-bottom: 1px solid var(--line-soft);
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: blur(14px) saturate(1.1);
  }
  .brand{ display:flex; align-items:center; text-decoration:none; }
  .brand img{ height:26px; width:auto; display:block; }
  .hstatus{ display:flex; align-items:center; gap:8px; }
  .hstatus .dot{ width:6px; height:6px; border-radius:50%; background: var(--verified); animation: dotPulse 1.8s ease-out infinite; }
  @keyframes dotPulse{
    0%{ box-shadow: 0 0 0 0 color-mix(in srgb, var(--verified) 55%, transparent); }
    70%{ box-shadow: 0 0 0 7px transparent; }
    100%{ box-shadow: 0 0 0 0 transparent; }
  }
  .hstatus span.txt{ font-family: var(--mono); font-size: 11.5px; color: var(--text-faint); letter-spacing:.03em; }
  .back-link{ font-size: 13px; color: var(--text-muted); text-decoration:none; padding:7px 13px; border-radius:999px; border:1px solid var(--line); transition:border-color .2s, color .2s; }
  .back-link:hover{ border-color: var(--text-faint); color: var(--text); }
  .header-right{ display:flex; align-items:center; gap:16px; }
  @media (max-width: 560px){ .hstatus span.txt{ display:none; } }

  .theme-toggle{ display:flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:transparent; color:var(--text-muted); cursor:pointer; flex-shrink:0; }
  .theme-toggle:hover{ border-color: var(--brass); color: var(--text); }
  .theme-toggle svg{ width:16px; height:16px; }
  .theme-toggle .icon-sun{ display:none; }
  .theme-toggle .icon-moon{ display:block; }
  :root[data-theme="light"] .theme-toggle .icon-sun{ display:block; }
  :root[data-theme="light"] .theme-toggle .icon-moon{ display:none; }

  .hidden{ display:none !important; }
  .icon-btn{ display:flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:transparent; color:var(--text-muted); cursor:pointer; flex-shrink:0; position:relative; }
  .icon-btn:hover{ border-color: var(--brass); color: var(--text); }
  .icon-btn svg{ width:16px; height:16px; }

  .visitor-badge{ display:flex; align-items:center; gap:6px; font-family: var(--mono); font-size:11px; color:var(--text-faint); border:1px solid var(--line); padding:6px 12px; border-radius:999px; white-space:nowrap; }
  @media (max-width: 860px){ .visitor-badge{ display:none !important; } }

  .history-panel{
    position:absolute; top: 56px; right: clamp(16px,4vw,32px); z-index: 30;
    width: min(340px, calc(100vw - 32px));
    background: var(--bg-1); border:1px solid var(--line); border-radius: 16px;
    box-shadow: 0 24px 60px -20px rgba(0,0,0,.45);
    padding: 10px; display:none; max-height: min(420px, 70vh); overflow-y:auto;
  }
  .history-panel.open{ display:block; }
  .history-panel h4{ font-family: var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-faint); margin: 6px 8px 10px; }
  .history-row{ padding:11px 9px; border-radius:11px; cursor:pointer; }
  .history-row:hover{ background: var(--bg-2); }
  .history-row-top{ display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .history-row .h-mode{ font-size:13.5px; font-weight:600; color:var(--text); }
  .history-row .h-status{ font-family: var(--mono); font-size:10px; letter-spacing:.04em; text-transform:uppercase; padding:3px 9px; border-radius:999px; border:1px solid var(--line); color:var(--text-faint); white-space:nowrap; }
  .history-row .h-status.done{ color: var(--verified); border-color: color-mix(in srgb, var(--verified) 40%, var(--line)); }
  .history-row .h-meta{ font-family: var(--mono); font-size:11px; color:var(--text-faint); margin-top:5px; }
  .history-row .h-detail{ display:none; margin-top:9px; padding-top:9px; border-top:1px solid var(--line-soft); font-size:12.5px; color:var(--text-muted); line-height:1.5; }
  .history-row.expanded .h-detail{ display:block; }

  /* ============ CHAT SHELL ============ */
  .chat-shell{ flex:1; display:flex; flex-direction:column; max-width: 760px; width:100%; margin:0 auto; min-height:0; }
  .chat-log{ flex:1; overflow-y:auto; padding: 26px clamp(14px,4vw,26px) 16px; display:flex; flex-direction:column; gap:16px; scroll-behavior: smooth; }

  .row{ display:flex; gap:10px; max-width: 86%; animation: rowIn .35s ease both; }
  .row.full{ max-width: 100%; width:100%; }
  .row.ai{ align-self:flex-start; }
  .row.user{ align-self:flex-end; flex-direction: row-reverse; }
  @keyframes rowIn{ from{ opacity:0; transform: translateY(8px); } to{ opacity:1; transform:translateY(0); } }

  .avatar{ width:28px; height:28px; border-radius:8px; background:var(--bg-3); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .avatar svg{ width:14px; height:14px; color:var(--brass); }
  .avatar.user{ background: color-mix(in srgb, var(--brass) 18%, var(--bg-3)); border-color: color-mix(in srgb, var(--brass) 30%, var(--line)); }
  .avatar.user svg{ color: var(--text); }

  .bubble{ background:var(--bg-2); border:1px solid var(--line); padding:11px 15px; border-radius:14px; border-top-left-radius:4px; font-size:14.5px; line-height:1.55; color:var(--text); }
  .row.user .bubble{ background: color-mix(in srgb, var(--brass) 20%, var(--bg-2)); border-color: color-mix(in srgb, var(--brass) 38%, var(--line)); border-radius:14px; border-top-right-radius:4px; border-top-left-radius:14px; }

  .cursor-blink{ display:inline-block; width:2px; height:1em; background:var(--text-faint); margin-left:1px; vertical-align:text-bottom; animation: blink 0.9s step-end infinite; }
  @keyframes blink{ 50%{ opacity:0; } }

  .typing{ display:flex; gap:4px; padding:3px 2px; }
  .typing span{ width:6px; height:6px; border-radius:50%; background:var(--text-faint); animation: bounce 1.1s infinite ease-in-out; }
  .typing span:nth-child(2){ animation-delay:.15s; }
  .typing span:nth-child(3){ animation-delay:.3s; }
  @keyframes bounce{ 0%,60%,100%{ transform:translateY(0); opacity:.45; } 30%{ transform:translateY(-4px); opacity:1; } }

  /* card: wider AI-side panels (upload, forms, results) */
  .card{ background:var(--bg-1); border:1px solid var(--line); border-radius: var(--radius); padding: 20px 22px; width:100%; }
  .card .lead{ font-size:13.5px; color:var(--text-muted); margin: 0 0 2px; }

  /* dropzone */
  .dropzone{ border:1.5px dashed var(--line); border-radius:14px; padding:18px; display:flex; align-items:center; gap:14px; cursor:pointer; transition: border-color .2s ease, background .2s ease; background:transparent; }
  .dropzone:hover, .dropzone.drag{ border-color: var(--brass); background: color-mix(in srgb, var(--brass) 7%, transparent); }
  .dz-icon{ width:38px; height:38px; border-radius:10px; background:var(--bg-2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--brass); flex-shrink:0; }
  .dz-icon svg{ width:18px; height:18px; }
  .dz-text strong{ display:block; font-size:14px; color:var(--text); margin-bottom:2px; font-weight:600; }
  .dz-text span{ font-size:12.5px; color:var(--text-faint); }

  .proc-panel{ margin-top: 2px; }
  .proc-file{ display:flex; align-items:center; gap:10px; font-size:13.5px; color:var(--text); margin-bottom:10px; }
  .proc-file svg{ width:16px; height:16px; color:var(--text-faint); flex-shrink:0; }
  .proc-file .fname{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .proc-label{ font-family:var(--mono); font-size:11.5px; color:var(--text-faint); letter-spacing:.03em; margin-bottom:6px; }
  .progress-track{ height:6px; border-radius:99px; background:var(--bg-2); overflow:hidden; }
  .progress-fill{ height:100%; width:0%; border-radius:99px; background: linear-gradient(90deg, var(--brass), var(--brass-strong)); transition: width .12s linear; }
  .proc-status{ display:flex; justify-content:space-between; margin-top:6px; font-family:var(--mono); font-size:11.5px; color:var(--text-faint); }
  .proc-status .pct{ font-variant-numeric: tabular-nums; }
  .proc-done{ display:flex; align-items:center; gap:8px; font-size:13.5px; color: var(--verified); margin-top: 4px; }
  .proc-done svg{ width:15px; height:15px; flex-shrink:0; }

  .step-list{ display:flex; flex-direction:column; gap:11px; margin-top: 14px; }
  .step-line{ display:flex; align-items:center; gap:10px; font-size:13.5px; color:var(--text-faint); transition: color .2s ease; }
  .step-line.active{ color: var(--text); }
  .step-line.done{ color: var(--text-muted); }
  .mark{ width:17px; height:17px; border-radius:50%; border:1.5px solid var(--line); flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .step-line.active .mark{ border-color: var(--brass); border-top-color: transparent; animation: spin .8s linear infinite; }
  .step-line.done .mark{ border-color: var(--verified); background: color-mix(in srgb, var(--verified) 18%, transparent); }
  .step-line.done .mark svg{ width:10px; height:10px; color:var(--verified); }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .choice-row{ display:flex; flex-direction:column; gap:9px; margin-top: 12px; }
  .choice-btn{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 15px; border-radius:11px; border:1px solid var(--line); background:var(--bg-2); color:var(--text); font-size:14px; font-weight:500; cursor:pointer; text-align:left; transition: border-color .2s ease, background .2s ease; }
  .choice-btn:hover{ border-color: var(--brass); background: color-mix(in srgb, var(--brass) 9%, var(--bg-2)); }
  .choice-btn svg{ width:15px; height:15px; color:var(--text-faint); flex-shrink:0; }
  .choice-btn[disabled]{ opacity:.45; pointer-events:none; }

  .field{ margin-top: 14px; }
  .field label{ display:block; font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-faint); margin-bottom:7px; }
  .field input{ width:100%; background:var(--bg-2); border:1px solid var(--line); border-radius:10px; padding:11px 14px; color:var(--text); font-size:14.5px; font-family: var(--sans); }
  .field input:focus{ outline:none; border-color:var(--brass); }
  .field input::placeholder{ color: var(--text-faint); }
  .field-row{ display:flex; gap:10px; flex-wrap: wrap; }
  .field-row .field{ flex:1; min-width:160px; }

  .otp-row{ display:flex; gap:9px; margin-top:14px; }
  .otp-box{ width:42px; height:50px; border-radius:10px; background:var(--bg-2); border:1px solid var(--line); color:var(--text); font-family:var(--mono); font-size:19px; text-align:center; }
  .otp-box:focus{ outline:none; border-color:var(--brass); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brass) 22%, transparent); }

  .btn{ display:inline-flex; align-items:center; gap:8px; font-family:var(--sans); font-size:14px; font-weight:600; padding:11px 19px; border-radius:999px; text-decoration:none; cursor:pointer; border:1px solid transparent; white-space:nowrap; transition: transform .15s ease, box-shadow .15s ease, background .2s ease, border-color .2s ease, opacity .2s ease; }
  .btn-primary{ background: linear-gradient(135deg, var(--brass), var(--brass-strong)); color:#fff; box-shadow: 0 0 0 1px var(--glow), 0 8px 24px -8px var(--glow); }
  .btn-primary:hover{ transform: translateY(-1px); box-shadow: 0 0 0 1px var(--glow), 0 10px 30px -6px var(--glow); }
  .btn-primary[disabled]{ opacity:.4; pointer-events:none; transform:none; }
  .btn-ghost{ border-color:var(--line); color:var(--text); background:transparent; }
  .btn-ghost:hover{ border-color:var(--brass); }
  .btn-row{ display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }

  .verify-ok{ display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--verified); margin-top:12px; }
  .verify-ok svg{ width:15px; height:15px; }

  /* result */
  .result-card{ background: linear-gradient(180deg, var(--bg-1), var(--bg-2)); border:1px solid var(--line); border-radius: var(--radius); padding: 30px 26px; text-align:center; box-shadow: 0 30px 80px -30px rgba(47,140,255,.22), 0 20px 45px -22px rgba(0,0,0,.6); }
  .result-eyebrow{ font-family:var(--mono); font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint); }
  .result-amount{ font-family:var(--serif); font-weight:800; font-size:clamp(26px,5.6vw,40px); letter-spacing:-0.02em; margin:12px 0 6px; font-variant-numeric: tabular-nums; text-shadow: 0 0 46px color-mix(in srgb, var(--brass) 45%, transparent); }
  .result-warn{ font-size:12.5px; font-weight:600; color: var(--danger); margin: 0 0 12px; }
  .result-caption{ font-size:13px; color:var(--text-muted); margin:0; }
  .result-note{ font-family:var(--mono); font-size:10.5px; color:var(--text-faint); margin-top:10px; letter-spacing:.02em; }

  .findings-wrap{ position:relative; margin-top:24px; text-align:left; border-top:1px solid var(--line-soft); padding-top: 4px; }
  .findings-list{ display:flex; flex-direction:column; filter: blur(6px); user-select:none; }
  .finding-row{ display:flex; justify-content:space-between; gap:10px; padding:12px 2px; border-top:1px solid var(--line-soft); font-size:13.5px; color:var(--text-muted); }
  .finding-row:first-child{ border-top:none; }
  .finding-row b{ color:var(--text); font-weight:500; }
  .finding-row .amt{ font-family:var(--mono); color:var(--text); flex-shrink:0; }
  .findings-overlay{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding: 20px; text-align:center; background: linear-gradient(180deg, transparent, var(--bg-1) 60%); }
  .findings-overlay .lock{ width:30px; height:30px; border-radius:9px; background:var(--bg-2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--text-faint); }
  .findings-overlay .lock svg{ width:15px; height:15px; }
  .findings-overlay p{ font-size:13px; color:var(--text-muted); max-width:32ch; margin:0; }

  .chip-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .chip{ display:flex; align-items:center; gap:7px; font-family:var(--mono); font-size:11.5px; color:var(--text-muted); background:var(--bg-2); border:1px solid var(--line); padding:6px 11px; border-radius:999px; }
  .chip svg{ width:12px; height:12px; color:var(--verified); }

  /* composer */
  .composer{ border-top:1px solid var(--line-soft); padding: 14px clamp(14px,4vw,26px); background: var(--bg); position: sticky; bottom:0; }
  .composer form{ display:flex; gap:10px; max-width:760px; margin:0 auto; }
  .composer input{ flex:1; background:var(--bg-1); border:1px solid var(--line); border-radius:999px; padding:12px 18px; color:var(--text); font-size:14.5px; font-family: var(--sans); }
  .composer input:focus{ outline:none; border-color: var(--brass); }
  .composer input::placeholder{ color: var(--text-faint); }
  .composer button{ width:44px; height:44px; border-radius:50%; background: linear-gradient(135deg, var(--brass), var(--brass-strong)); border:none; color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; transition: box-shadow .2s ease, transform .15s ease; }
  .composer button:hover{ transform: translateY(-1px); box-shadow: 0 8px 22px -8px var(--glow); }
  .composer button svg{ width:17px; height:17px; }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background: var(--line); border-radius: 99px; }
  ::-webkit-scrollbar-track{ background: transparent; }
</style>

<!-- ============================================================ -->

<div class="app">

<script>
(function(){
  "use strict";

  /* ---------- tiny utils ---------- */
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function wait(ms){ return new Promise(function(res){ setTimeout(res, ms); }); }
  function formatINR(num, decimals){
    if(decimals === undefined) decimals = true;
    num = Number(num);
    var neg = num < 0; num = Math.abs(num);
    var fixed = decimals ? num.toFixed(2) : String(Math.round(num));
    var parts = fixed.split('.');
    var intPart = parts[0], dec = parts[1];
    var last3 = intPart.slice(-3);
    var rest = intPart.slice(0, -3);
    var formattedRest = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',');
    var joined = rest ? (formattedRest + ',' + last3) : last3;
    return (neg ? '-' : '') + '₹' + joined + (dec !== undefined ? '.' + dec : '');
  }

  var chatLog = document.getElementById('chatLog');
  var phaseText = document.getElementById('phaseText');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function setPhase(t){ phaseText.textContent = t; }
  function scrollBottom(){ requestAnimationFrame(function(){ chatLog.scrollTop = chatLog.scrollHeight + 200; }); }

  /* ---------- theme toggle ---------- */
  var themeToggle = document.getElementById('themeToggle');
  themeToggle.addEventListener('click', function(){
    var isLight = document.documentElement.getAttribute('data-theme') === 'light';
    if(isLight){
      document.documentElement.removeAttribute('data-theme');
      try{ localStorage.setItem('darp-theme', 'dark'); }catch(e){}
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
      try{ localStorage.setItem('darp-theme', 'light'); }catch(e){}
    }
  });

  var aiAvatarSVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5c.6 1 1.9 1.7 3.5 1.7s2.9-.7 3.5-1.7"/><line x1="9" y1="9.5" x2="9" y2="9.5"/><line x1="15" y1="9.5" x2="15" y2="9.5"/></svg>';
  var userAvatarSVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c1.2-3.6 4-5.4 7-5.4s5.8 1.8 7 5.4"/></svg>';

  function addRow(side, full){
    var row = document.createElement('div');
    row.className = 'row ' + side + (full ? ' full' : '');
    var avatar = document.createElement('div');
    avatar.className = 'avatar' + (side === 'user' ? ' user' : '');
    avatar.innerHTML = side === 'user' ? userAvatarSVG : aiAvatarSVG;
    row.appendChild(avatar);
    chatLog.appendChild(row);
    scrollBottom();
    return row;
  }

  /* ---------- basic message helpers ---------- */
  function typingDelay(text){ return Math.max(420, Math.min(900, 280 + text.length * 4)); }

  function streamWords(bubble, text){
    return new Promise(function(resolve){
      if(reduceMotion){ bubble.textContent = text; resolve(); return; }
      var words = text.split(' ');
      var i = 0;
      var textNode = document.createTextNode('');
      var cursor = document.createElement('span');
      cursor.className = 'cursor-blink';
      bubble.appendChild(textNode);
      bubble.appendChild(cursor);
      function next(){
        if(i >= words.length){ cursor.remove(); resolve(); return; }
        textNode.nodeValue += (i > 0 ? ' ' : '') + words[i];
        i++;
        scrollBottom();
        setTimeout(next, 32 + Math.random() * 46);
      }
      next();
    });
  }

  function aiSay(text){
    return new Promise(function(resolve){
      var row = addRow('ai', false);
      var bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
      row.appendChild(bubble);
      scrollBottom();
      wait(typingDelay(text)).then(function(){
        bubble.textContent = '';
        return streamWords(bubble, text);
      }).then(function(){
        scrollBottom();
        wait(180).then(resolve);
      });
    });
  }

  function userSay(text){
    var row = addRow('user', false);
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    row.appendChild(bubble);
    scrollBottom();
    return wait(160);
  }

  function addCard(){
    var row = addRow('ai', true);
    var card = document.createElement('div');
    card.className = 'card';
    row.appendChild(card);
    scrollBottom();
    return card;
  }

  var nudge = 'Use the options above to continue.';

  /* ---------- choice ---------- */
  function aiChoice(text, options){
    return aiSay(text).then(function(){
      return new Promise(function(resolve){
        nudge = 'Pick one of the options above to continue.';
        var card = addCard();
        var wrap = document.createElement('div');
        wrap.className = 'choice-row';
        options.forEach(function(opt){
          var btn = document.createElement('button');
          btn.className = 'choice-btn';
          btn.type = 'button';
          btn.innerHTML = '<span>' + escapeHtml(opt.label) + '</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';
          btn.addEventListener('click', function(){
            Array.prototype.forEach.call(wrap.children, function(b){ b.disabled = true; });
            userSay(opt.label).then(function(){ resolve(opt.value); });
          });
          wrap.appendChild(btn);
        });
        card.appendChild(wrap);
        scrollBottom();
      });
    });
  }

  /* ---------- upload ---------- */
  var docSizeGuesses = [1204, 2870, 968, 3312, 1745, 2231];
  function aiUpload(text, opts){
    return aiSay(text).then(function(){
      return new Promise(function(resolve){
        nudge = 'Attach the requested file above to continue.';
        var card = addCard();
        var dz = document.createElement('div');
        dz.className = 'dropzone';
        dz.tabIndex = 0;
        dz.innerHTML =
          '<div class="dz-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><polyline points="7 9 12 4 17 9"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg></div>' +
          '<div class="dz-text"><strong>Click to upload' + (opts.hint ? ', or drag &amp; drop' : '') + '</strong><span>' + escapeHtml(opts.hint || 'PDF, Excel or CSV') + '</span></div>';
        var input = document.createElement('input');
        input.type = 'file';
        input.style.display = 'none';
        if(opts.accept) input.accept = opts.accept;
        dz.appendChild(input);
        card.appendChild(dz);
        scrollBottom();

        dz.addEventListener('click', function(){ input.click(); });
        dz.addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.key === ' '){ input.click(); } });
        ['dragover','dragenter'].forEach(function(ev){
          dz.addEventListener(ev, function(e){ e.preventDefault(); dz.classList.add('drag'); });
        });
        ['dragleave','drop'].forEach(function(ev){
          dz.addEventListener(ev, function(e){ e.preventDefault(); dz.classList.remove('drag'); });
        });
        dz.addEventListener('drop', function(e){
          if(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]){
            handleFile(e.dataTransfer.files[0]);
          }
        });
        input.addEventListener('change', function(){
          if(input.files && input.files[0]) handleFile(input.files[0]);
        });

        function handleFile(file){
          dz.remove();
          var proc = document.createElement('div');
          proc.className = 'proc-panel';
          proc.innerHTML =
            '<div class="proc-file"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></svg><span class="fname">' + escapeHtml(file.name) + '</span></div>' +
            '<div class="proc-label" id="procLabel">Uploading</div>' +
            '<div class="progress-track"><div class="progress-fill" id="procFill"></div></div>' +
            '<div class="proc-status"><span id="procMsg">Sending file…</span><span class="pct" id="procPct">0%</span></div>';
          card.appendChild(proc);
          scrollBottom();

          var fill = proc.querySelector('#procFill');
          var pct = proc.querySelector('#procPct');
          var msg = proc.querySelector('#procMsg');
          var label = proc.querySelector('#procLabel');
          var p = 0;
          var uploadTimer = setInterval(function(){
            p += Math.random() * 16 + 8;

  /* ---------- result ---------- */
  function animateCount(el, target, duration){
    var start = null;
    function tick(ts){
      if(start === null) start = ts;
      var t = Math.min(1, (ts - start) / duration);
      var eased = 1 - Math.pow(1 - t, 3);
      el.textContent = formatINR(target * eased, false);
      if(t < 1) requestAnimationFrame(tick);
      else el.textContent = formatINR(target, false);
    }
    requestAnimationFrame(tick);
  }

  /* ================= SESSION / HISTORY =================
     Mocked entirely in localStorage for this demo — stands in for the real
     cookie/account-based tracking that lands with the backend. Lets a visitor
     leave mid-flow and resume later, see a status once their info is with the
     team, and browse previously checked scenarios. */
  var SESSIONS_KEY = 'darp-sessions';
  var ACTIVE_KEY = 'darp-active-session';
  var VISITOR_KEY = 'darp-visitor';
  var activeSession = null;

  function loadSessions(){
    try{ return JSON.parse(localStorage.getItem(SESSIONS_KEY)) || []; }catch(e){ return []; }
  }
  function saveSessions(list){
    try{ localStorage.setItem(SESSIONS_KEY, JSON.stringify(list)); }catch(e){}
  }
  function genId(){
    return 'DARP-' + Math.random().toString(36).slice(2, 8).toUpperCase();
  }
  function createSession(){
    var s = { id: genId(), createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(), mode: null, status: 'in_progress', step: null, gstin: null, contact: null, result: null };
    var sessions = loadSessions();
    sessions.push(s);
    saveSessions(sessions);
    try{ localStorage.setItem(ACTIVE_KEY, s.id); }catch(e){}
    return s;
  }
  function checkpoint(step, extra, statusOverride){
    if(!activeSession) return;
    activeSession.step = step;
    activeSession.updatedAt = new Date().toISOString();
    if(extra){ for(var k in extra){ activeSession[k] = extra[k]; } }
    if(statusOverride) activeSession.status = statusOverride;
    var sessions = loadSessions();
    var idx = -1;
    for(var i = 0; i < sessions.length; i++){ if(sessions[i].id === activeSession.id){ idx = i; break; } }
    if(idx > -1) sessions[idx] = activeSession; else sessions.push(activeSession);
    saveSessions(sessions);
  }
  function getVisitor(){
    try{ return JSON.parse(localStorage.getItem(VISITOR_KEY)); }catch(e){ return null; }
  }
  function setVisitor(contact){
    var v = getVisitor() || { id: genId(), firstSeenAt: new Date().toISOString() };
    contact = contact || {};
    v.name = contact.name || v.name;
    v.email = contact.email || v.email;
    v.phone = contact.phone || v.phone;
    v.lastSeenAt = new Date().toISOString();
    try{ localStorage.setItem(VISITOR_KEY, JSON.stringify(v)); }catch(e){}
    return v;
  }
  function relativeTime(iso){
    var mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if(mins < 1) return 'just now';
    if(mins < 60) return mins + ' min ago';
    var hrs = Math.round(mins / 60);
    if(hrs < 24) return hrs + ' hr' + (hrs > 1 ? 's' : '') + ' ago';
    var days = Math.round(hrs / 24);
    return days + ' day' + (days > 1 ? 's' : '') + ' ago';
  }

  async function start(opts){
    opts = opts || {};
    var resumeStep = opts.resumeStep || null;
    var mode = opts.mode || null;
    var order = mode === 'gstin' ? GSTIN_STEPS : UPLOAD_STEPS;
    function passed(step){
      if(!resumeStep) return false;
      var oi = order.indexOf(resumeStep), si = order.indexOf(step);
      return oi > -1 && si > -1 && si <= oi;
    }

    setPhase('Getting started');
    if(!resumeStep){
      if(opts.skipGreeting){
        await aiSay('Let’s take a look at another one.');
      } else {
        await aiSay('Hi 👋 I’m DataTwin.');
        await aiSay('I’ll read your GST filings and surface every recoverable rupee of input tax credit — mismatches, reversals and blocked claims.');
      }
    }

      mode = await aiChoice('How would you like to get started?', [
        { label: 'Upload my GST documents', value: 'upload' },
        { label: 'Connect via GST number', value: 'gstin' }
      ]);
      order = mode === 'gstin' ? GSTIN_STEPS : UPLOAD_STEPS;
      checkpoint('mode_chosen', { mode: mode });
    }

    if(mode === 'upload'){
      setPhase('Collecting documents');
      if(passed('doc1_uploaded')){
        await recapChip('GSTR-2B uploaded · line items extracted');
      } else {
        await aiUpload('First, share your GSTR-2B for the period you’d like analyzed.', { accept: '.pdf,.xlsx,.csv,.json', hint: 'PDF, Excel, CSV or JSON export' });
        checkpoint('doc1_uploaded');
      }
      if(passed('doc2_uploaded')){
        await recapChip('Purchase register uploaded');
      } else {
        await aiUpload('Now your purchase register — an export from your ERP works fine.', { accept: '.xlsx,.csv', hint: 'Excel or CSV' });
        checkpoint('doc2_uploaded');
      }
      if(!passed('credit_notes_step')){
        await askOptionalCreditNotes();
        checkpoint('credit_notes_step');
      }
      await runFinalAnalysis('Based on the documents you shared · 3,214 line items', { passed: passed });
    } else {
      setPhase('Connecting to GST portal');
      var gstin = opts.gstin || null;
      if(!passed('gstin_captured')){
        gstin = await aiGstinForm('Sure — enter your GSTIN and I’ll pull your filings directly from the GST portal.');
        checkpoint('gstin_captured', { gstin: gstin });
      }

      if(passed('otp_verified')){
        await recapChip('GSTIN ' + gstin + ' connected · GSTR-2B & GSTR-1 retrieved');
      } else {
        await aiOtpForm('Sending a one-time code to the mobile number registered against ' + gstin + ' (••••••••92).');
        await aiLoadingSteps('Connecting to the GST portal.', [
          'Authenticating session',
          'Fetching GSTR-2B',
          'Fetching GSTR-1'
        ]);
        var row = addRow('ai', true);
        var card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = '<p class="lead">Retrieved for the last 2 return periods:</p><div class="chip-row"><span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>GSTR-2B · Jun–Jul 2026</span><span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>GSTR-1 · Jun–Jul 2026</span></div>';
        row.appendChild(card);
        scrollBottom();
        await wait(500);
        checkpoint('otp_verified');
      }

      setPhase('Collecting documents');
      if(passed('purchase_uploaded')){
        await recapChip('Purchase register uploaded');
      } else {
        await aiUpload('Your purchase register isn’t on the GST portal — export it from your ERP and I’ll take it from here.', { accept: '.xlsx,.csv', hint: 'Excel or CSV' });
        checkpoint('purchase_uploaded');
      }
      if(!passed('credit_notes_step')){
        await askOptionalCreditNotes();
        checkpoint('credit_notes_step');
      }
      await runFinalAnalysis('Based on 2 GSTN-retrieved periods · 3,214 line items', { passed: passed });
    }
  }

  async function boot(){
    var activeId = null;
    try{ activeId = localStorage.getItem(ACTIVE_KEY); }catch(e){}
    var sessions = loadSessions();
    var existing = null;
    for(var i = 0; i < sessions.length; i++){ if(sessions[i].id === activeId){ existing = sessions[i]; break; } }
    var hasHistory = sessions.some(function(s){ return s.step && s.id !== activeId; });

    renderVisitorBadge();
    renderHistoryButton(activeId);

    if(existing && existing.status === 'awaiting_team'){
      await showAwaitingTeamCard(existing);
      activeSession = createSession();
      await start({ skipGreeting: true });
      return;
    }

    if(existing && existing.status === 'in_progress' && existing.step){
      var choice = await showResumeCard(existing);
      if(choice === 'resume'){
        activeSession = existing;
        await start({ resumeStep: existing.step, mode: existing.mode, gstin: existing.gstin });
      } else {
        activeSession = createSession();
        await start({ skipGreeting: true });
      }
      return;
    }

    activeSession = existing || createSession();
    await start({ skipGreeting: hasHistory });
  }

  boot();
})();
</script>
